<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Manual Enrollment - AptitudePro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Geist:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed-dim": "#ffb95f",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-highest": "#dae2fd",
                    "primary": "#3525cd",
                    "error": "#ba1a1a",
                    "tertiary-container": "#885500",
                    "background": "#faf8ff",
                    "surface-container": "#eaedff",
                    "on-primary": "#ffffff",
                    "secondary-fixed": "#acedff",
                    "on-primary-fixed-variant": "#3323cc",
                    "surface-variant": "#dae2fd",
                    "on-primary-container": "#dad7ff",
                    "on-background": "#131b2e",
                    "inverse-on-surface": "#eef0ff",
                    "on-tertiary-fixed": "#2a1700",
                    "outline-variant": "#c7c4d8",
                    "on-secondary-container": "#006172",
                    "on-error": "#ffffff",
                    "error-container": "#ffdad6",
                    "surface-container-low": "#f2f3ff",
                    "secondary-container": "#57dffe",
                    "on-secondary-fixed-variant": "#004e5c",
                    "on-secondary-fixed": "#001f26",
                    "on-tertiary-container": "#ffd4a4",
                    "outline": "#777587",
                    "secondary": "#00687a",
                    "primary-container": "#4f46e5",
                    "on-tertiary": "#ffffff",
                    "on-primary-fixed": "#0f0069",
                    "on-surface": "#131b2e",
                    "primary-fixed-dim": "#c3c0ff",
                    "surface": "#faf8ff",
                    "primary-fixed": "#e2dfff",
                    "surface-tint": "#4d44e3",
                    "on-tertiary-fixed-variant": "#653e00",
                    "on-surface-variant": "#464555",
                    "on-secondary": "#ffffff",
                    "tertiary-fixed": "#ffddb8",
                    "tertiary": "#684000",
                    "on-error-container": "#93000a",
                    "inverse-surface": "#283044",
                    "inverse-primary": "#c3c0ff",
                    "surface-bright": "#faf8ff",
                    "secondary-fixed-dim": "#4cd7f6",
                    "surface-container-high": "#e2e7ff",
                    "surface-dim": "#d2d9f4"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-mobile": "16px",
                    "gutter": "24px",
                    "assessment-max-width": "800px",
                    "unit": "8px",
                    "margin-desktop": "40px",
                    "container-max-width": "1200px"
            },
            "fontFamily": {
                    "headline-md": ["Geist"],
                    "display-sm": ["Geist"],
                    "body-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "display-lg": ["Geist"],
                    "caption": ["Inter"],
                    "question-text": ["Inter"],
                    "metric-label": ["Geist"]
            },
            "fontSize": {
                    "headline-md": ["24px", {"lineHeight": "1.4", "fontWeight": "600"}],
                    "display-sm": ["36px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "caption": ["12px", {"lineHeight": "1.4", "fontWeight": "400"}],
                    "question-text": ["22px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
                    "metric-label": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}]
            }
          }
        }
      }
    </script>
</head>
<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-4 md:p-gutter antialiased">
<!-- Modal Container -->
<main class="w-full max-w-[640px] bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0px_10px_15px_-3px_rgba(79,70,229,0.05)] overflow-hidden flex flex-col">
<!-- Header -->
<header class="px-8 py-6 border-b border-outline-variant flex justify-between items-center bg-surface-container-lowest">
<div>
<h1 class="font-display-sm text-display-sm text-on-surface">Manual Enrollment</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Add a new student to an upcoming assessment cohort.</p>
</div>
<button aria-label="Close" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Form Content -->
<div class="p-8 flex flex-col gap-6">
<!-- Full Name -->
<div class="flex flex-col gap-2">
<label class="font-metric-label text-metric-label text-on-surface" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="fullName" placeholder="e.g. Jane Doe" type="text"/>
</div>
</div>
<!-- Email Address -->
<div class="flex flex-col gap-2">
<label class="font-metric-label text-metric-label text-on-surface" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" placeholder="jane.doe@example.com" type="email"/>
</div>
</div>
<!-- Split Row: Cohort & Date -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Cohort Selection -->
<div class="flex flex-col gap-2">
<label class="font-metric-label text-metric-label text-on-surface" for="cohort">Cohort</label>
<div class="relative">
<select class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors appearance-none" id="cohort">
<option disabled="" selected="" value="">Select a cohort...</option>
<option value="fall2024">Fall 2024 Intake - Alpha</option>
<option value="spring2025">Spring 2025 Intake - Beta</option>
<option value="custom">Custom Evaluation Group</option>
</select>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">expand_more</span>
</div>
</div>
</div>
<!-- Start Date -->
<div class="flex flex-col gap-2">
<label class="font-metric-label text-metric-label text-on-surface" for="startDate">Start Date</label>
<div class="relative">
<input class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors appearance-none text-left" id="startDate" type="date"/>
</div>
</div>
</div>
<!-- Send Invitation Toggle -->
<div class="mt-4 pt-6 border-t border-outline-variant flex items-center justify-between">
<div>
<h3 class="font-headline-md text-body-lg text-on-surface">Send Invitation</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Automatically email the student with onboarding instructions and assessment links.</p>
</div>
<!-- Toggle UI (Active State) -->
<div aria-checked="true" class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 bg-primary" role="switch">
<span class="translate-x-5 pointer-events-none inline-block h-5 w-5 transform rounded-full bg-on-primary shadow ring-0 transition duration-200 ease-in-out"></span>
</div>
</div>
</div>
<!-- Footer Actions -->
<footer class="px-8 py-6 bg-surface-container flex justify-end gap-4 items-center border-t border-outline-variant">
<button class="px-6 py-3 rounded-lg font-metric-label text-metric-label text-on-surface border border-outline hover:bg-surface-variant transition-colors focus:outline-none focus:ring-2 focus:ring-outline-variant">
                Cancel
            </button>
<button class="px-6 py-3 rounded-lg font-metric-label text-metric-label bg-primary text-on-primary hover:bg-surface-tint shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">person_add</span>
                Enroll Student
            </button>
</footer>
</main>
</body></html>
